[build]
  functions = "netlify/functions"
  command = "npm install && node test-arb.js"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions.arb-tick]
  # Every 3 min (was every 2). Fewer ticks = fewer Tesla live_status reads, which are ~99% of the
  # API bill. Timing stays fine for 30-min energy slots; the just-in-time charge carries a 15-min
  # buffer and shouldFetchLive uses a 6-min pre-slot buffer. NOTE: heartbeat/viability logs in
  # arb-tick.js use `m % 30 < 3` / `m % 10 < 3` (widened from < 2) so they still fire under this
  # cadence regardless of Netlify's minute offset.
  schedule = "*/3 * * * *"

# Never let the browser cache the service worker — always revalidate so app
# updates (and SW fixes) reach devices promptly instead of being pinned to a
# stale worker. iOS in particular is sticky about this.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/appspecific/com.tesla.3p.public-key.pem"
  to = "/.netlify/functions/public-key"
  status = 200
  force = true

[[redirects]]
  from = "/callback"
  to = "/callback.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
