<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting...</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f5f5f7;color:#1d1d1f}
  .wrap{text-align:center;padding:40px 20px}
  .spinner{width:40px;height:40px;border:3px solid #e5e5ea;border-top-color:#007aff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  h2{font-size:18px;font-weight:600;margin-bottom:8px}
  p{font-size:14px;color:#8e8e93}
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <h2>Connecting to Tesla...</h2>
  <p>Please wait while we complete your login.</p>
</div>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('h2').textContent = 'Login failed';
    document.querySelector('p').textContent = 'Tesla returned an error: ' + error;
    return;
  }

  if (!code) {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('h2').textContent = 'Something went wrong';
    document.querySelector('p').textContent = 'No authorisation code received from Tesla.';
    return;
  }

  // Retrieve the device ID that was set before the login redirect
  const deviceId = localStorage.getItem('device_id');
  if (!deviceId) {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('h2').textContent = 'Session error';
    document.querySelector('p').textContent = 'Device ID missing — please try connecting again.';
    return;
  }

  try {
    // Exchange the code server-side so the client secret is never exposed
    const resp = await fetch('/.netlify/functions/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'exchange', code, device_id: deviceId })
    });
    const data = await resp.json();

    if (data.access_token) {
      // Pass the token back to the main app via sessionStorage
      sessionStorage.setItem('tesla_auth_result', JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expiry: data.expiry
      }));
      window.location.replace('/');
    } else {
      throw new Error(data.error || 'Token exchange failed');
    }
  } catch (e) {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('h2').textContent = 'Login failed';
    document.querySelector('p').textContent = e.message;
  }
})();
</script>
</body>
</html>
